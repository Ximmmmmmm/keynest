<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>KeyNest</title>
  </head>
  <body>
    <header>
      <h1>KeyNest</h1>
      <span id="status" class="badge">检查中…</span>
    </header>

    <!-- 密码填充 -->
    <section id="locked-note" class="note hidden">
      KeyNest 已锁定或未启动。请先打开钥巢并解锁密码库。
    </section>

    <section id="list-section" class="hidden">
      <div class="hint">点击条目即可填充到当前页面</div>
      <ul id="entries"></ul>
    </section>

    <section id="empty" class="note hidden">这个网站没有匹配的条目。</section>

    <!-- 广告过滤：按站点暂停 -->
    <section id="adblock-section" class="block hidden">
      <div class="block-head">
        <span class="block-title">广告与跟踪器过滤</span>
        <span id="adblock-state" class="badge"></span>
      </div>
      <p id="adblock-host" class="block-host"></p>
      <button id="adblock-toggle" class="ghost wide"></button>
      <p id="adblock-note" class="block-note hidden"></p>
    </section>

    <section id="error" class="note error hidden"></section>

    <footer>
      <button id="refresh" class="ghost">刷新</button>
      <button id="open-options" class="ghost">设置</button>
      <span class="foot-note">不会读取或修改浏览器保存的密码</span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
