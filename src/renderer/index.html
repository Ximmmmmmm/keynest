<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>钥巢</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- 图标精灵 -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-shield" viewBox="0 0 24 24">
          <path d="M12 3l7 3v5.5c0 4.3-2.9 7.6-7 9.5-4.1-1.9-7-5.2-7-9.5V6l7-3z" />
          <circle cx="12" cy="10.8" r="1.7" />
          <path d="M12 12.5v3" />
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" />
        </symbol>
        <symbol id="i-lock" viewBox="0 0 24 24">
          <rect x="4.5" y="10.5" width="15" height="9.5" rx="2.5" />
          <path d="M8 10.5V8a4 4 0 018 0v2.5" />
        </symbol>
        <symbol id="i-sliders" viewBox="0 0 24 24">
          <path d="M4 7h7M15 7h5M4 17h5M13 17h7" />
          <circle cx="13" cy="7" r="2" /><circle cx="11" cy="17" r="2" />
        </symbol>
        <symbol id="i-key" viewBox="0 0 24 24">
          <circle cx="7.5" cy="12" r="3.5" /><path d="M11 12h9M16.5 12v3.2M20 12v2.4" />
        </symbol>
        <symbol id="i-copy" viewBox="0 0 24 24">
          <rect x="9" y="9" width="11" height="11" rx="2.2" />
          <path d="M15 9V6.2A2.2 2.2 0 0012.8 4H6.2A2.2 2.2 0 004 6.2v6.6A2.2 2.2 0 006.2 15H9" />
        </symbol>
        <symbol id="i-eye" viewBox="0 0 24 24">
          <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" />
          <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="i-eye-off" viewBox="0 0 24 24">
          <path d="M4 4l16 16" />
          <path d="M9.5 6.2A9.6 9.6 0 0112 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 01-3.2 4M6.7 7.6A17 17 0 002.5 12s3.5 6.5 9.5 6.5c1.3 0 2.5-.3 3.6-.8" />
        </symbol>
        <symbol id="i-edit" viewBox="0 0 24 24">
          <path d="M4.5 19.5h4L19 9a2.1 2.1 0 00-3-3L5.5 16.5v3z" /><path d="M14.5 7.5l3 3" />
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
          <path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5" />
        </symbol>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></symbol>
        <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></symbol>
        <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24">
          <path d="M20 12a8 8 0 11-2.3-5.6" /><path d="M20 4.5V9h-4.5" />
        </symbol>
        <symbol id="i-download" viewBox="0 0 24 24">
          <path d="M12 4v10M8 11l4 4 4-4M5 19.5h14" />
        </symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 6.5" /></symbol>
        <symbol id="i-link" viewBox="0 0 24 24">
          <path d="M10 13.8a4 4 0 005.7 0l3-3a4 4 0 10-5.7-5.7l-1 1" />
          <path d="M14 10.2a4 4 0 00-5.7 0l-3 3a4 4 0 105.7 5.7l1-1" />
        </symbol>
        <symbol id="i-user" viewBox="0 0 24 24">
          <circle cx="12" cy="8.5" r="3.6" /><path d="M5 20c1.3-3.6 4-5.2 7-5.2s5.7 1.6 7 5.2" />
        </symbol>
        <symbol id="i-note" viewBox="0 0 24 24">
          <path d="M6 3.5h8l4 4V20a.5.5 0 01-.5.5H6a.5.5 0 01-.5-.5V4a.5.5 0 01.5-.5z" />
          <path d="M14 3.5V8h4M8.5 13h7M8.5 16.5h4.5" />
        </symbol>
        <symbol id="i-wand" viewBox="0 0 24 24">
          <path d="M5 19L15 9" />
          <path d="M17.5 3.8l.9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9.9-2.3z" />
        </symbol>
        <symbol id="i-folder" viewBox="0 0 24 24">
          <path d="M3.5 7.5a2 2 0 012-2h3.2l2 2h7.8a2 2 0 012 2v8a2 2 0 01-2 2H5.5a2 2 0 01-2-2v-10z" />
        </symbol>
        <symbol id="i-info" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8.5" /><path d="M12 11v5.2" /><circle cx="12" cy="7.9" r=".9" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8.5" /><path d="M12 7.5V12l3 1.8" />
        </symbol>
        <symbol id="i-grid" viewBox="0 0 24 24">
          <rect x="4" y="4" width="7" height="7" rx="2" /><rect x="13" y="4" width="7" height="7" rx="2" />
          <rect x="4" y="13" width="7" height="7" rx="2" /><rect x="13" y="13" width="7" height="7" rx="2" />
        </symbol>
        <symbol id="i-alert" viewBox="0 0 24 24">
          <path d="M12 4.5L21 19.5H3L12 4.5z" /><path d="M12 10v4" />
          <circle cx="12" cy="16.8" r=".9" fill="currentColor" stroke="none" />
        </symbol>
        <symbol id="i-logout" viewBox="0 0 24 24">
          <path d="M14 5.5H6.5A1.5 1.5 0 005 7v10a1.5 1.5 0 001.5 1.5H14" />
          <path d="M16.5 8.5L20 12l-3.5 3.5M10 12h10" />
        </symbol>
        <symbol id="i-external" viewBox="0 0 24 24">
          <path d="M14 4h6v6M20 4l-8.5 8.5" />
          <path d="M18 14v4.5A1.5 1.5 0 0116.5 20H5.5A1.5 1.5 0 014 18.5v-11A1.5 1.5 0 015.5 6H10" />
        </symbol>
      </defs>
    </svg>

    <!-- ============ 锁屏 ============ -->
    <section class="lock-screen" id="lockScreen">
      <div class="lock-ambient"></div>
      <div class="lock-card">
        <div class="lock-brand">
          <span class="brand-mark"><svg class="ico"><use href="#i-shield"></use></svg></span>
          <div class="lock-brand-text">
            <h1>钥巢</h1>
            <p>KEYNEST</p>
          </div>
        </div>

        <div class="lock-copy">
          <h2 id="lockTitle">解锁密码库</h2>
          <p id="lockSub">主密码仅用于本机解密，不会上传，也不会写入磁盘。</p>
        </div>

        <form id="lockForm" autocomplete="off" novalidate>
          <label class="input-wrap">
            <svg class="ico lead"><use href="#i-lock"></use></svg>
            <input
              type="password"
              id="masterInput"
              placeholder="主密码"
              autocomplete="current-password"
              spellcheck="false"
              aria-label="主密码"
            />
            <button type="button" class="icon-btn eye" data-toggle-password="masterInput" aria-label="显示密码">
              <svg class="ico"><use href="#i-eye"></use></svg>
            </button>
          </label>

          <label class="input-wrap" id="confirmWrap" hidden>
            <svg class="ico lead"><use href="#i-check"></use></svg>
            <input
              type="password"
              id="masterConfirm"
              placeholder="再次输入主密码"
              autocomplete="new-password"
              spellcheck="false"
              aria-label="确认主密码"
            />
          </label>

          <div class="meter" id="setupMeter" hidden>
            <div class="meter-bars"><i></i><i></i><i></i><i></i></div>
            <span class="meter-label" id="setupMeterLabel">—</span>
          </div>

          <p class="form-error" id="lockError" role="alert"></p>

          <button class="btn primary block lg" id="lockBtn" type="submit">解锁</button>
        </form>

        <div class="lock-foot">
          <svg class="ico"><use href="#i-shield"></use></svg>
          <span id="lockFootText">AES-256-GCM 加密 · scrypt 密钥派生 · 数据仅存本机</span>
        </div>
      </div>
    </section>

    <!-- ============ 主界面 ============ -->
    <div class="shell" id="shell" hidden>
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-mark sm"><svg class="ico"><use href="#i-shield"></use></svg></span>
          <div class="brand-text">
            <strong>钥巢</strong>
            <span>KeyNest</span>
          </div>
        </div>

        <button class="btn primary new-entry" id="newEntryBtn" title="新建条目 (Ctrl+N)">
          <svg class="ico"><use href="#i-plus"></use></svg>
          <span class="label">新建条目</span>
        </button>

        <nav class="nav" aria-label="分类">
          <div class="nav-head">
            <span class="nav-label">分类</span>
            <button class="mini-btn" id="addCategoryBtn" title="新增分类">
              <svg class="ico"><use href="#i-plus"></use></svg>
            </button>
          </div>
          <div id="categoryNav"></div>
        </nav>

        <div class="sidebar-foot">
          <button class="foot-btn" data-action="generator" title="密码生成器 (Ctrl+G)">
            <svg class="ico"><use href="#i-wand"></use></svg>
            <span class="label">密码生成器</span>
          </button>
          <button class="foot-btn" data-action="settings" title="设置">
            <svg class="ico"><use href="#i-sliders"></use></svg>
            <span class="label">设置</span>
          </button>
          <button class="foot-btn" data-action="lock" title="锁定 (Ctrl+L)">
            <svg class="ico"><use href="#i-logout"></use></svg>
            <span class="label">锁定</span>
          </button>
        </div>
      </aside>

      <div class="scrim" id="scrim" data-action="close-drawer"></div>

      <main class="list-pane">
        <header class="list-header">
          <div class="list-top">
            <button class="icon-btn drawer-btn" data-action="drawer" aria-label="打开分类菜单">
              <svg class="ico"><use href="#i-menu"></use></svg>
            </button>
            <h2 id="listTitle">全部条目</h2>
            <span class="count-pill" id="listCount">0</span>
            <button class="icon-btn sort-btn" id="sortBtn" title="切换排序">
              <svg class="ico"><use href="#i-clock"></use></svg>
            </button>
          </div>
          <div class="search">
            <svg class="ico lead"><use href="#i-search"></use></svg>
            <input
              id="searchInput"
              type="search"
              placeholder="搜索标题、账号、网址或备注"
              autocomplete="off"
              spellcheck="false"
              aria-label="搜索"
            />
            <button class="clear-btn" id="clearSearchBtn" hidden aria-label="清除搜索">
              <svg class="ico"><use href="#i-x"></use></svg>
            </button>
            <kbd class="hint-key">Ctrl F</kbd>
          </div>
        </header>

        <div class="entry-list" id="entryList" role="listbox" aria-label="密码条目"></div>

        <div class="list-empty" id="listEmpty" hidden>
          <div class="empty-illustration">
            <svg class="ico"><use href="#i-search"></use></svg>
          </div>
          <p id="listEmptyText">没有找到匹配的条目</p>
          <button class="btn ghost sm" id="emptyResetBtn" data-action="empty-reset" hidden>清除筛选</button>
        </div>

        <footer class="list-foot">
          <span id="entryTotal">共 0 条</span>
          <span class="dot-sep"></span>
          <span class="muted">双击复制密码</span>
        </footer>
      </main>

      <section class="detail-pane" id="detailPane" aria-live="polite"></section>
    </div>

    <div class="modal-root" id="modalRoot"></div>
    <div class="toast-root" id="toastRoot" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
