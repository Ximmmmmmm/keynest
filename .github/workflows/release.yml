name: Release

# 只在推送 v* 标签时触发。日常提交走 ci.yml，两者互不干扰。
on:
  push:
    tags:
      - "v*"
  # 手动触发：用于在不移动 tag 的前提下重跑某个已存在的 tag。
  # 注意 checkout 用的 ref 是 inputs.tag（见各作业），所以构建的仍然是
  # tag 指向的那个提交，不会拿 main 的最新代码去冒充 v0.4.3。
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.4.3）"
        required: true
        type: string

# 最小权限：默认只读。只有真正创建 Release 的 publish 作业才提权到 write，
# 其余两个作业（校验、构建）即使被注入也拿不到写权限。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ------------------------------------------------------------------ #
  # 1) 先验证：版本一致、格式、静态检查、测试。全绿才允许打包。
  # ------------------------------------------------------------------ #
  verify:
    name: 发布前校验
    runs-on: windows-latest
    env:
      REF_NAME: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: 安装 Rust
        # 钉到 SHA：分支名会移动，SHA 不会。
        # 注意：钉住之后 action 无法从 ref 推断工具链，必须显式给 toolchain。
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable 分支
        with:
          toolchain: stable
          components: rustfmt, clippy

      # 标签和 Cargo.toml 版本对不上，就会发出去一个"名字叫 v0.4.4、实际是 0.4.3"的包。
      # 这种错误一旦发布就无法悄悄撤回，所以放在最前面拦住。
      - name: 标签与 Cargo 版本一致性
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          TAG="${REF_NAME#v}"
          CORE=$(grep -m1 '^version' keynest-core/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          GUI=$(grep -m1 '^version' keynest-egui/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "tag=$TAG core=$CORE gui=$GUI"
          if [ "$TAG" != "$CORE" ] || [ "$TAG" != "$GUI" ]; then
            echo "::error::标签 $TAG 与 Cargo 版本（core=$CORE, gui=$GUI）不一致"
            exit 1
          fi

      - name: 格式检查
        working-directory: rust
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试
        working-directory: rust
        run: cargo test --workspace

  # ------------------------------------------------------------------ #
  # 依赖审计：必须跑在 Linux。
  # cargo-deny-action 是 Docker 容器型 action，Windows/macOS runner
  # 不支持容器型 action——第一次真实运行就卡在这里。
  # ------------------------------------------------------------------ #
  audit:
    name: 依赖审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          manifest-path: rust/Cargo.toml
          command: check
          arguments: --all-features

  # ------------------------------------------------------------------ #
  # 2) 构建并收集发布文件
  # ------------------------------------------------------------------ #
  build:
    name: 构建 Windows x64
    needs: [verify, audit]
    runs-on: windows-latest
    env:
      REF_NAME: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable 分支
        with:
          toolchain: stable

      - name: 编译
        working-directory: rust
        run: cargo build --release -p keynest-egui

      # 显式白名单。不用通配符，避免哪天误把 vault.dat、测试库、
      # 构建缓存或私钥一起塞进发布包。
      - name: 收集发布文件
        shell: pwsh
        run: |
          $stage = "release-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "rust/target/release/keynest-egui.exe" "$stage/KeyNest.exe"
          Copy-Item "README_EN.md" "$stage/README_EN.md"
          Copy-Item "README.md"    "$stage/README.md"
          Copy-Item "SECURITY.md"  "$stage/SECURITY.md"
          Copy-Item "LICENSE-MIT"  "$stage/LICENSE-MIT"
          Copy-Item "LICENSE-APACHE" "$stage/LICENSE-APACHE"

          # 使用说明：把数据位置与"没有审计"这件事写在最显眼处。
          # 文件名必须是纯 ASCII：GitHub Releases 的上传 API 不接受非 ASCII 文件名，
          # 中文名会被改写成 default.txt，导致 SHA256SUMS 与实际下载文件名对不上。
          @"
          钥巢 KeyNest $env:REF_NAME（Windows x64 绿色版）

          用法
            1. 把 KeyNest.exe 放到任意目录，双击运行。
            2. 首次启动会让你设置主密码（至少 12 位，无法找回）。
            3. 数据默认保存在 %LOCALAPPDATA%\KeyNest\vault.dat。
               若检测到旧的 %APPDATA%\KeyNest\vault.dat，会继续使用那里的库。

          注意
            * 绿色版不写注册表、不需要管理员权限，删掉 exe 即卸载。
            * 删除 exe 不会删除你的密码库；密码库需要你自己决定如何处理。
            * 本软件**没有经过第三方安全审计**，请自行评估风险。
            * 主密码一旦遗忘无法恢复，请务必自行妥善保管。

          校验
            同目录下的 SHA256SUMS 可用于核对文件完整性：
              certutil -hashfile KeyNest.exe SHA256
          "@ | Set-Content -Encoding UTF8 "$stage/INSTALL.txt"

          Get-ChildItem $stage | Select-Object Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: keynest-windows
          path: release-stage/
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------ #
  # 3) 生成 SHA-256、抽取 CHANGELOG、创建 Release
  # ------------------------------------------------------------------ #
  publish:
    name: 创建 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 只在这个作业里需要写权限
    env:
      REF_NAME: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: 下载构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: keynest-windows
          path: release-stage

      # 在 Linux 上算哈希，避免 Windows 的 CRLF/编码差异影响校验文件格式。
      - name: 生成 SHA-256 校验文件
        working-directory: release-stage
        run: |
          set -euo pipefail
          # 覆盖全部随包发布的文件，而不是只算 exe——
          # 用户要能确认自己拿到的 README/LICENSE 也没被替换过。
          sha256sum KeyNest.exe INSTALL.txt README.md README_EN.md SECURITY.md \
                    LICENSE-MIT LICENSE-APACHE > SHA256SUMS
          cat SHA256SUMS

      # Release Notes 直接取 CHANGELOG 里对应版本那一节，避免"发布说明和实际改动对不上"。
      - name: 抽取 CHANGELOG 对应版本
        shell: bash
        run: |
          set -euo pipefail
          VER="${REF_NAME#v}"
          # 用 index() 而不是正则：版本号里的点和方括号在正则里都要转义，
          # 少转一个就会把 [0.4.3] 当成字符类，抽出来是空的。
          awk -v ver="$VER" '
            index($0, "## [" ver "]") == 1 { flag = 1; next }
            flag && index($0, "## [") == 1 { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG 中没有找到 $VER 的记录，使用默认说明"
            echo "见 CHANGELOG.md" > release-notes.md
          fi
          echo "----- release notes -----"
          cat release-notes.md

      - name: 发布前最后一道敏感文件检查
        working-directory: release-stage
        shell: bash
        run: |
          set -euo pipefail
          ls -la
          # 发布包里只允许这些文件，多一个都要停下来看
          BAD=$(ls | grep -vE '^(KeyNest\.exe|README\.md|README_EN\.md|SECURITY\.md|LICENSE-MIT|LICENSE-APACHE|INSTALL\.txt|SHA256SUMS)$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::发布包里出现了预期之外的文件: $BAD"
            exit 1
          fi
          for f in vault.dat .env id_rsa; do
            if [ -e "$f" ]; then echo "::error::发现敏感文件 $f"; exit 1; fi
          done

      - name: 创建 Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.2.2
        with:
          # 必须显式指定 tag_name：workflow_dispatch 触发时没有 tag 上下文，
          # 不写这一行会生成一个 untagged-* 的孤儿 Release，与 v0.4.3 脱钩。
          tag_name: ${{ env.REF_NAME }}
          name: "钥巢 KeyNest ${{ env.REF_NAME }}"
          body_path: release-notes.md
          files: |
            release-stage/KeyNest.exe
            release-stage/INSTALL.txt
            release-stage/README.md
            release-stage/README_EN.md
            release-stage/SECURITY.md
            release-stage/LICENSE-MIT
            release-stage/LICENSE-APACHE
            release-stage/SHA256SUMS
          draft: true          # 先落成草稿，人工确认后再手动发布
          prerelease: false
          fail_on_unmatched_files: true
