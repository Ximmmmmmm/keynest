name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的重复推送取消旧任务，省额度也省等待
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：CI 只读代码与结果，不需要写任何东西。
# 即使某个作业被注入，也拿不到仓库写权限。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # 所有 target 共用：新增的 warning 直接当失败处理，
  # 否则「先提交、以后再清」的欠账永远还不完。
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------- #
  # 核心库：纯逻辑，无 GUI 依赖，三个平台都应该能编能测
  # ---------------------------------------------------------------- #
  core:
    name: core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          persist-credentials: false

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable 分支
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: rust -> target

      - name: 格式检查
        working-directory: rust
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy -p keynest-core -p keynest-paths --all-targets -- -D warnings

      - name: 单元测试 + 集成测试（含健壮性/篡改测试）
        working-directory: rust
        # 带上 keynest-paths：它是**跨平台**的纯路径逻辑 crate，
        # 它的测试理应在三个平台都跑，而不是只在 Windows 上跑。
        # （keynest-bridge 依赖 Windows 命名管道，留给 gui-windows 作业。）
        run: cargo test -p keynest-core -p keynest-paths --all-targets

  # ---------------------------------------------------------------- #
  # 桌面端：只保证 Windows 上的完整体验，这与发行目标一致
  # ---------------------------------------------------------------- #
  gui-windows:
    name: GUI / windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          persist-credentials: false

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable 分支
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: rust -> target

      - name: Clippy（整个工作区，含 GUI 与示例）
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 测试（含 GUI 纯逻辑测试）
        working-directory: rust
        run: cargo test --workspace

      - name: 发布构建
        working-directory: rust
        run: cargo build --release -p keynest-egui

      - name: 上传可执行文件
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: keynest-egui-windows
          path: rust/target/release/keynest-egui.exe
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------- #
  # 覆盖率门槛：用实测数字定线，不拍脑袋
  #
  # 2026-11 实测 keynest-core 行覆盖 87.14%（含 Windows 专属的 secure.rs，
  # 那里的 Win32 剪贴板路径无法在 CI 里单测）。门槛设为 85%，留 2 个点余量：
  # 新增一批没测试的代码就会掉下来，这正是它该起的作用。
  # ---------------------------------------------------------------- #
  coverage:
    name: coverage / core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable 分支
        with:
          toolchain: stable
          components: llvm-tools-preview
      # 注意：钉到 SHA 后 action 无法从 ref 名推断要装什么，必须显式给 tool。
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68  # 2026-11 主线
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: rust -> target
      - name: 行覆盖率门槛
        working-directory: rust
        run: cargo llvm-cov -p keynest-core --fail-under-lines 85 --summary-only

  # ---------------------------------------------------------------- #
  # 依赖审计：许可证 / 漏洞 / 重复版本 / 来源
  # ---------------------------------------------------------------- #
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          manifest-path: rust/Cargo.toml
          command: check
          # `cargo-deny check` 只接受 [WHICH]（advisories/bans/licenses/sources/all），
          # **没有 `--all-features` 这个参数**。
          #
          # 原来写的是 `--all-features`，跑起来直接：
          #   error: unexpected argument '--all-features' found
          # 也就是说这个作业即使 CI 正常触发也会**立刻失败**。
          #
          # 本地实测 `check all` → advisories ok, bans ok, licenses ok, sources ok。
          arguments: all

  # ---------------------------------------------------------------- #
  # 浏览器扩展（Manifest V3）
  # ---------------------------------------------------------------- #
  # 为什么必须进 CI：扩展已经承担了本项目近一半的功能面
  # （自动填充、广告与跟踪器过滤、阅读模式、夜间模式），
  # 却一度完全不受持续集成保护——任何提交都能悄悄破坏它，
  # 而且要等到有人手动跑测试才会发现。
  #
  # 扩展**零运行时依赖**，所以这个作业不需要 npm ci：
  # 直接用 Node 内置的测试运行器即可。这既是它容易进 CI 的原因，
  # 也说明没有引入供应链风险。
  extension:
    name: browser extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"
      # 单元 + 集成测试（模块系统、配置中心、权限门禁、注入、自动应用…）
      #
      # 用 `ls` 展开而不是直接写 glob：如果测试文件被误删，
      # glob 会把 `tests/*.test.js` 原样传给 node，node 会报一个
      # 让人摸不着头脑的错。这里显式展开并检查数量。
      - name: 单元与集成测试
        working-directory: browser-extension
        run: |
          set -euo pipefail
          files=$(ls tests/*.test.js)
          count=$(ls tests/*.test.js | wc -l)
          if [ "$count" -lt 5 ]; then
            echo "测试文件数量异常（$count 个），可能是 glob 没展开"; exit 1
          fi
          echo "运行 $count 个测试文件"
          node --test $files
      # 装配自检：模块注册、权限与 manifest 一致、门禁表完整性、
      # 内容脚本无 import、版本号同步——这些不需要浏览器就能查
      - name: 装配自检
        working-directory: browser-extension
        run: node scripts/selfcheck.mjs
      # 发布前自检：版本一致性、发布白名单与扩展实际文件是否对得上、
      # 仓库里有没有误提交的敏感文件。这些**编译器和测试都发现不了**，
      # 只在真正打包时才暴露。
      - name: 发布前自检
        run: node scripts/release-check.mjs

      # 冒烟：确认 manifest 与入口文件都在，且能被解析
      - name: 扩展清单可解析
        working-directory: browser-extension
        run: |
          node -e "const m=require('fs').readFileSync('manifest.json','utf8');JSON.parse(m);console.log('manifest ok')"
          for f in background/service-worker.js content/content-script.js popup/popup.js; do
            test -f "$f" || { echo "缺少 $f"; exit 1; }
          done

  # ---------------------------------------------------------------- #
  # 旧版 Electron 实现：仍在仓库里，但已被 Rust 版取代。
  # 保留这层测试只是为了让还没升级的用户不至于拿到彻底坏掉的旧版，
  # 不阻塞主线，也不作为发布标准。1.0 前会连同 src/ 一起移除。
  # ---------------------------------------------------------------- #
  legacy-electron:
    name: legacy electron（非阻塞）
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: 单元测试
        # 跑**全部**测试文件，不是手写一串。
        #
        # 原来只跑了 vault / cli / csv-discovery 三个，
        # 而 test/ 下其实有 7 个——import、export、import-view、launcher
        # 全都没跑。其中导入导出是密码管理器的核心路径。
        #
        # 写成通配符以后，新增测试文件自动就被纳入检查，
        # 不会再因为「忘了往清单里加一行」而漏跑。
        run: |
          set -euo pipefail
          files=$(ls test/*.test.js)
          count=$(ls test/*.test.js | wc -l)
          if [ "$count" -lt 7 ]; then
            echo "测试文件数量异常（$count 个）"; exit 1
          fi
          echo "运行 $count 个测试文件"
          for f in $files; do
            echo "--- $f"
            node "$f"
          done
