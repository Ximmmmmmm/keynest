[package]
name = "keynest-core"
version = "0.1.0"
edition = "2021"
description = "钥巢的加密仓库核心（纯逻辑，无 UI 依赖）"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scrypt = "0.11"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
